[package]
name = "trove-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["sync"], optional = true }

[features]
default = []
tokio-async = ["tokio"]
