[package]
name = "trove-node"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "trove-node"
path = "src/main.rs"

[dependencies]
trove-core = { path = "../core" }
trovec = { path = "../compiler" }
trove-vm = { path = "../vm" }

anyhow = "1.0.99"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-error = "0.2.1"
serde = { version = "1.0.219", features = ["serde_derive"] }
hex = "0.4.3"
pretty_assertions = "1.4.1"
clap = { version = "4.5.45", features = ["derive"] }
serde_json = "1.0.143"
jsonrpc-core = "18.0.0"
ws = "0.9.2"
trace = "0.1.7"
tracing = "0.1.41"
tungstenite = "0.27.0"
